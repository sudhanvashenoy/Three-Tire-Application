services:
  # ---------- Database tier ----------
  db:
    image: postgres:16-alpine
    container_name: three-tier-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    volumes:
      # Bind mount: database files are stored in ./volumes/postgres-data on your machine
      - ./volumes/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Application (backend) tier ----------
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: three-tier-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: appdb
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
